name: Build Docker images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: ./server
      - run: npm test
        working-directory: ./server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/arthurldvd/mfp-client:latest ./client
      - if: github.event_name == 'push'
        run: docker push ghcr.io/arthurldvd/mfp-client:latest
      - run: docker build -t ghcr.io/arthurldvd/mfp-server:latest ./server
      - if: github.event_name == 'push'
        run: docker push ghcr.io/arthurldvd/mfp-server:latest
