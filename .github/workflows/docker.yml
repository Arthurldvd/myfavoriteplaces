name: Build Docker images

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/mfp-client:latest ./client
      - run: docker push ghcr.io/${{ github.repository_owner }}/mfp-client:latest
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/mfp-server:latest ./server
      - run: docker push ghcr.io/${{ github.repository_owner }}/mfp-server:latest
